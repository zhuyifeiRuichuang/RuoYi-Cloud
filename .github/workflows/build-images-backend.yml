name: Build Backend Images (RuoYi-Cloud)

# 全手动触发：使用 release-backend 产出的 Release JAR，构建多架构镜像并推送到 ghcr.io
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version must match the existing Release tag, e.g. 3.6.8 (tag is used as-is, no leading v)'
        required: true
        default: '3.6.8'

permissions:
  contents: read
  packages: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release JARs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ inputs.version }}" -D artifacts --repo "${{ github.repository }}"
          ls -lh artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: artifacts/*.jar
          if-no-files-found: error

  images:
    needs: download
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth, system, gen, job, file, monitor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: artifacts

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image (${{ matrix.service }})
        run: |
          cp "artifacts/ruoyi-${{ matrix.service }}.jar" app.jar
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/ruoyi-${{ matrix.service }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --file cicd/docker/backend/Dockerfile \
            --tag "${IMAGE}:${{ inputs.version }}" \
            --tag "${IMAGE}:latest" \
            --push .

      # 尽力将镜像设为公开，便于 deploy-test 跨仓库匿名拉取（失败不影响主流程）
      - name: Make package public (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "/user/packages/container/ruoyi-${{ matrix.service }}/visibility" -f visibility=public || true
