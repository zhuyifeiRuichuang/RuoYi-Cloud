name: Release Backend (RuoYi-Cloud)

# 全手动触发：在 Actions 页手动运行，并填写版本号（不含 v 前缀）
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 3.6.8 (no leading v)'
        required: true
        default: '3.6.8'

permissions:
  contents: write   # 创建 Release
  packages: write   # 发布到 GitHub Maven Packages

env:
  MAVEN_OPTS: '-Xmx2g'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin, latest)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Maven (latest stable 3.9.x)
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.16'

      # 强制直连 Maven Central、杜绝任何镜像（含中国地区加速）；同时配置 GitHub Packages 鉴权
      - name: Configure Maven settings (no mirror + GitHub Packages auth)
        uses: s4u/maven-settings-action@v3.1.0
        with:
          servers: |
            [{
              "id": "github",
              "username": "${{ github.actor }}",
              "password": "${{ secrets.GITHUB_TOKEN }}"
            }]
          mirrors: |
            [{
              "id": "central-only",
              "name": "Maven Central (no mirror)",
              "mirrorOf": "*",
              "url": "https://repo.maven.apache.org/maven2"
            }]

      # GitHub Packages Maven Registry 禁止重复发布同一 GA:V（重复上传返回 409 Conflict），
      # 且无法覆盖。为使 workflow 对同一版本号可幂等重跑，发布前先删除 Packages 中
      # 与本次构建版本相同的既有版本。
      # 删除走 user 级 REST 端点（与官方 actions/delete-package-versions 相同）：
      #   GET    /users/{owner}/packages/maven/{package_name}/versions
      #   DELETE /users/{owner}/packages/maven/{package_name}/versions/{id}
      # Maven 包托管在触发 workflow 的同一仓库时，GITHUB_TOKEN 具备删除权限（packages: write）。
      - name: Remove existing package versions with same version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          VERSION=$(awk '/<parent>/,/<\/parent>/{next} /<version>/{gsub(/.*<version>|<\/version>.*/,""); print; exit}' pom.xml)
          echo "Target version: ${VERSION}"
          BASE="https://maven.pkg.github.com/${{ github.repository }}"
          API="https://api.github.com"
          AUTH="${{ github.repository_owner }}:${GH_TOKEN}"
          for pom in $(find . -name pom.xml -not -path '*/target/*'); do
            if grep -q "<parent>" "${pom}"; then n=2; else n=1; fi
            GA=$(sed -n "s/.*<artifactId>\(.*\)<\/artifactId>.*/\1/p" "${pom}" | sed -n "${n}p")
            [ -z "${GA}" ] && continue
            PKG="com.ruoyi.${GA}"
            URL="${BASE}/com/ruoyi/${GA}/${VERSION}/${GA}-${VERSION}.pom"
            # maven.pkg.github.com 对已存在工件返回 302（重定向到 blob 存储），404 表示不存在
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -u "${AUTH}" "${URL}")
            if [ "${CODE}" != "200" ] && [ "${CODE}" != "302" ]; then
              echo "${PKG}@${VERSION}: not published (HTTP ${CODE}), nothing to remove"
              continue
            fi
            IDS=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "${API}/users/${GH_OWNER}/packages/maven/${PKG}/versions?per_page=100" \
                  | jq -r --arg v "${VERSION}" '.[] | select(.name == $v) | .id')
            if [ -z "${IDS}" ]; then
              echo "${PKG}@${VERSION}: registry HTTP ${CODE} but no matching version id, skip"
              continue
            fi
            for ID in ${IDS}; do
              DEL=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    "${API}/users/${GH_OWNER}/packages/maven/${PKG}/versions/${ID}")
              echo "${PKG}@${VERSION}: delete version id ${ID} -> HTTP ${DEL}"
              # 204=已删除，404=此前已被删除（视为成功）
              if [ "${DEL}" != "204" ] && [ "${DEL}" != "404" ]; then
                echo "ERROR: failed to delete ${PKG}@${VERSION}, deploy would fail with 409 Conflict"
                exit 1
              fi
            done
          done

      # 打包并发布到 GitHub Maven Packages（com.ruoyi 下各模块）。跳过单测（CI 无 DB/Redis）
      - name: Build and deploy to GitHub Packages (Maven)
        run: |
          mvn -B -ntp clean deploy -DskipTests \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}

      # 收集 7 个可运行 fat-jar，统一命名为 ruoyi-<service>.jar，作为 Release 资产
      - name: Collect release JARs
        run: |
          mkdir -p staging
          collect() {
            local path="$1" name="$2" jar="$3"
            local f
            # 各模块 pom 配置 <finalName>${project.artifactId}</finalName>，
            # fat jar 产物为 <artifactId>.jar（无版本号），同时兼容带版本号的产物
            f=$(find "$path/target" -maxdepth 1 \( -name "${jar}.jar" -o -name "${jar}-*.jar" \) ! -name "*-sources.jar" ! -name "original-*.jar" | head -n1)
            if [ -z "$f" ]; then
              echo "ERROR: fat jar not found for ${jar} in ${path}/target"
              exit 1
            fi
            cp "$f" "staging/ruoyi-${name}.jar"
          }
          collect ruoyi-gateway gateway ruoyi-gateway
          collect ruoyi-auth auth ruoyi-auth
          collect ruoyi-modules/ruoyi-system system ruoyi-modules-system
          collect ruoyi-modules/ruoyi-gen gen ruoyi-modules-gen
          collect ruoyi-modules/ruoyi-job job ruoyi-modules-job
          collect ruoyi-modules/ruoyi-file file ruoyi-modules-file
          collect ruoyi-visual/ruoyi-monitor monitor ruoyi-visual-monitor
          ls -lh staging

      - name: Create GitHub Release and upload JARs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skip create and refresh JARs"
            gh release upload "${TAG}" staging/ruoyi-*.jar --repo "${{ github.repository }}" --clobber || true
          else
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "RuoYi-Cloud v${{ inputs.version }}" \
              --notes "Automated release of RuoYi-Cloud backend JARs (version ${{ inputs.version }}). Also published to GitHub Maven Packages under com.ruoyi." \
              staging/ruoyi-*.jar
          fi
