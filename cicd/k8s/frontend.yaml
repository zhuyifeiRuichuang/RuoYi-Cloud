# RuoYi-Vue3 前端部署（镜像版本占位 __VERSION__，由 deploy-test 注入）
# 镜像：ghcr.io/zhuyifeiRuichuang/ruoyi-vue3/ruoyi-web:__VERSION__
# nginx 反向代理 /prod-api -> ruoyi-gateway:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-web
  labels: { app: ruoyi-web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ruoyi-web }
  template:
    metadata:
      labels: { app: ruoyi-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/zhuyifeiRuichuang/ruoyi-vue3/ruoyi-web:__VERSION__
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-web
spec:
  selector: { app: ruoyi-web }
  ports:
    - { port: 80, targetPort: 80 }
