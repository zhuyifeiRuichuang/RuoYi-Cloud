# RuoYi-Cloud 后端 7 个微服务部署（镜像版本占位 __VERSION__，由 deploy-test 注入）
# 镜像：ghcr.io/zhuyifeiRuichuang/ruoyi-cloud/ruoyi-<svc>:__VERSION__
# Nacos/MySQL/Redis 地址沿用服务名（同命名空间 ruoyi）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-gateway
  labels: { app: ruoyi-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ruoyi-gateway }
  template:
    metadata:
      labels: { app: ruoyi-gateway }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/zhuyifeiRuichuang/ruoyi-cloud/ruoyi-gateway:__VERSION__
          env:
            - name: JAVA_OPTS
              value: >-
                -Dspring.profiles.active=dev
                -Dspring.cloud.nacos.discovery.server-addr=ruoyi-nacos:8848
                -Dspring.cloud.nacos.config.server-addr=ruoyi-nacos:8848
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-gateway
spec:
  selector: { app: ruoyi-gateway }
  ports:
    - { port: 8080, targetPort: 8080 }
---
